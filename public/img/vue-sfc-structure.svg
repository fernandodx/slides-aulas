<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <linearGradient id="vueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42d392"/>
      <stop offset="100%" stop-color="#647eff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Window Card -->
  <rect x="40" y="30" width="720" height="590" rx="20" fill="#1e1e2e" filter="url(#shadow)" stroke="#313244" stroke-width="2"/>

  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="50" rx="20" fill="#181825"/>
  <rect x="40" y="60" width="720" height="20" fill="#181825"/>
  
  <!-- Mac Window Dots -->
  <circle cx="75" cy="55" r="7" fill="#f38ba8"/>
  <circle cx="100" cy="55" r="7" fill="#f9e2af"/>
  <circle cx="125" cy="55" r="7" fill="#a6e3a1"/>

  <!-- Title Tab -->
  <text x="400" y="61" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    CardProduto.vue — Single File Component (SFC)
  </text>

  <!-- 1. TEMPLATE SECTION -->
  <g transform="translate(70, 105)">
    <rect width="660" height="145" rx="12" fill="#181825" stroke="#42d392" stroke-width="2"/>
    <rect x="16" y="14" width="110" height="28" rx="6" fill="#42d392"/>
    <text x="71" y="33" fill="#11111b" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" text-anchor="middle">&lt;template&gt;</text>
    <text x="140" y="33" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">HTML &amp; Estrutura Visual do Componente</text>
    
    <!-- Code preview -->
    <text x="30" y="75" fill="#89dceb" font-family="'Fira Code', monospace" font-size="15">&lt;<tspan fill="#f38ba8">div</tspan> <tspan fill="#fab387">class</tspan>=<tspan fill="#a6e3a1">"card"</tspan>&gt;</text>
    <text x="55" y="102" fill="#cdd6f4" font-family="'Fira Code', monospace" font-size="15">&lt;<tspan fill="#f38ba8">h2</tspan>&gt;{{ <tspan fill="#fab387">titulo</tspan> }}&lt;/<tspan fill="#f38ba8">h2</tspan>&gt;</text>
    <text x="30" y="128" fill="#89dceb" font-family="'Fira Code', monospace" font-size="15">&lt;/<tspan fill="#f38ba8">div</tspan>&gt;</text>
  </g>

  <!-- 2. SCRIPT SECTION -->
  <g transform="translate(70, 270)">
    <rect width="660" height="155" rx="12" fill="#181825" stroke="#89b4fa" stroke-width="2"/>
    <rect x="16" y="14" width="150" height="28" rx="6" fill="#89b4fa"/>
    <text x="91" y="33" fill="#11111b" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" text-anchor="middle">&lt;script setup&gt;</text>
    <text x="180" y="33" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">Lógica de Estado &amp; Comportamento (JS/TS)</text>
    
    <!-- Code preview -->
    <text x="30" y="75" fill="#cba6f7" font-family="'Fira Code', monospace" font-size="15">import <tspan fill="#cdd6f4">{ ref, onMounted }</tspan> from <tspan fill="#a6e3a1">'vue'</tspan>;</text>
    <text x="30" y="105" fill="#cba6f7" font-family="'Fira Code', monospace" font-size="15">const <tspan fill="#89dceb">titulo</tspan> = <tspan fill="#89b4fa">ref</tspan>(<tspan fill="#a6e3a1">'Notebook Gamer'</tspan>);</text>
    <text x="30" y="135" fill="#89b4fa" font-family="'Fira Code', monospace" font-size="15">onMounted<tspan fill="#cdd6f4">(() =&gt; console.log(</tspan><tspan fill="#a6e3a1">'Montado!'</tspan><tspan fill="#cdd6f4">));</tspan></text>
  </g>

  <!-- 3. STYLE SECTION -->
  <g transform="translate(70, 445)">
    <rect width="660" height="145" rx="12" fill="#181825" stroke="#f5c2e7" stroke-width="2"/>
    <rect x="16" y="14" width="160" height="28" rx="6" fill="#f5c2e7"/>
    <text x="96" y="33" fill="#11111b" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" text-anchor="middle">&lt;style scoped&gt;</text>
    <text x="190" y="33" fill="#a6adc8" font-family="-apple-system, sans-serif" font-size="14" font-weight="500">Estilos CSS Isolados por Componente</text>
    
    <!-- Code preview -->
    <text x="30" y="75" fill="#f38ba8" font-family="'Fira Code', monospace" font-size="15">.card <tspan fill="#cdd6f4">{</tspan></text>
    <text x="55" y="102" fill="#89dceb" font-family="'Fira Code', monospace" font-size="15">padding<tspan fill="#cdd6f4">: </tspan><tspan fill="#fab387">20px</tspan><tspan fill="#cdd6f4">; </tspan><tspan fill="#89dceb">border-radius</tspan><tspan fill="#cdd6f4">: </tspan><tspan fill="#fab387">12px</tspan><tspan fill="#cdd6f4">;</tspan></text>
    <text x="30" y="128" fill="#cdd6f4" font-family="'Fira Code', monospace" font-size="15">}</text>
  </g>
</svg>
